name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck tmux
      - name: Syntax check
        run: |
          for file in cockpit.tmux bin/cockpit scripts/*.sh scripts/agents/*.sh tests/*.sh; do
            bash -n "$file"
          done
      - name: ShellCheck
        run: shellcheck -e SC1090,SC1091 cockpit.tmux bin/cockpit scripts/*.sh scripts/agents/*.sh tests/*.sh
      - name: Tests
        run: tests/run.sh
